name: Build

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  jvm:
    name: JVM 17
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test KMP JVM core
        run: ./gradlew :luak-core:jvmTest --no-daemon --stacktrace
      - name: Build JVM integrations
        run: ./gradlew :luak-jvm:build --no-daemon --stacktrace

  web:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: JavaScript
            task: jsNodeTest
          - target: Wasm
            task: wasmJsNodeTest
          - target: WasmWasi
            task: wasmWasiNodeTest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run ${{ matrix.target }} tests
        run: ./gradlew :luak-core:${{ matrix.task }} --no-daemon --stacktrace

  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x64
            os: ubuntu-latest
            task: linuxX64Test
          - target: Windows x64
            os: windows-latest
            task: mingwX64Test
          - target: macOS x64
            os: macos-15-intel
            task: macosX64Test
          - target: macOS ARM64
            os: macos-15
            task: macosArm64Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run ${{ matrix.target }} tests
        run: ./gradlew :luak-core:${{ matrix.task }} --no-daemon --stacktrace

  # Linux ARM64 takes two runners rather than one. The Kotlin/Native compiler
  # does not run on a linux-aarch64 host at all - it builds for that target
  # only from Linux x64, Windows x64, or macOS - so an ARM runner cannot
  # compile the tests, and an x64 one cannot run them. The x64 runner links the
  # test executable and the ARM one runs it, which is the only way to get the
  # tests onto the hardware they are meant to prove.
  native-linux-arm64-link:
    name: Native Linux ARM64 (link)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Link the Linux ARM64 tests
        run: ./gradlew :luak-core:linuxArm64TestBinaries --no-daemon --stacktrace
      - name: Upload the test executable
        uses: actions/upload-artifact@v7
        with:
          name: linuxArm64-test
          path: luak-core/build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error
          retention-days: 1

  native-linux-arm64:
    name: Native Linux ARM64
    runs-on: ubuntu-24.04-arm
    needs: native-linux-arm64-link
    steps:
      - name: Download the test executable
        uses: actions/download-artifact@v8
        with:
          name: linuxArm64-test
      # A Kotlin/Native binary carries everything it needs, so there is no JDK
      # or Gradle on this runner; the artifact does not keep its mode bit.
      - name: Run Linux ARM64 tests
        run: |
          chmod +x test.kexe
          ./test.kexe

  publication:
    name: Verify publications
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish all variants to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
