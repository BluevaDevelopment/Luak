name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without a leading v
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Verify release
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to repo.blueva.net
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve release version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "RELEASE_VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"
      - name: Publish KMP and JVM artifacts
        run: ./gradlew publishAllPublicationsToBluevaRepoRepository --no-daemon --stacktrace
        env:
          BLUEVA_REPO_USERNAME: ${{ secrets.BLUEVA_REPO_USERNAME }}
          BLUEVA_REPO_SECRET: ${{ secrets.BLUEVA_REPO_SECRET }}
